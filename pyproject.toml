[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fit5230-safe-latent-diffusion"
version = "0.1.0"
description = "Reproducible SD3.5 Medium jailbreak evaluation and defence scaffold for FIT5230."
readme = "README.md"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
